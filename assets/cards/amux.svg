<svg xmlns="http://www.w3.org/2000/svg" width="420" height="150" viewBox="0 0 420 150" role="img" aria-labelledby="title desc">
  <title id="title">amux</title>
  <desc id="desc">Terminal workspaces with split panes, a file explorer, 12 themes and Claude Code support.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2027"/>
      <stop offset="1" stop-color="#1D3944"/>
    </linearGradient>
    <radialGradient id="glow" cx=".86" cy=".3" r=".5">
      <stop offset="0" stop-color="#00D9FF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .name { font: 700 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #E6EDF3 }
    .tag  { font: 500 11.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #00D9FF; letter-spacing: .3px }
    .desc { font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #A9BCC6 }
    .lang { font: 400 11.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #8FA6B2 }
    .art { stroke: #00D9FF; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round }
    .float { animation: float 4s ease-in-out infinite }
    .ping  { transform-origin: 362px 47px; animation: ping 2.4s ease-out infinite }
    .blink { animation: blink 1.1s step-end infinite }
    @keyframes float { 50% { transform: translateY(-3px) } }
    @keyframes ping  { from { transform: scale(1); opacity: .7 } to { transform: scale(2.6); opacity: 0 } }
    @keyframes blink { 50% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>

  <rect x=".5" y=".5" width="419" height="149" rx="12" fill="url(#bg)" stroke="#2C5364"/>
  <rect x=".5" y=".5" width="419" height="149" rx="12" fill="url(#glow)"/>

  <g class="art" fill="none">
    <rect x="324" y="18" width="78" height="60" rx="6" fill="#00D9FF" fill-opacity=".06"/>
    <path d="M324 28h78M358 28v50M358 53h44"/>
    <circle cx="330.5" cy="23" r="1.4" fill="#00D9FF"/><circle cx="336" cy="23" r="1.4" fill="#00D9FF"/><circle cx="341.5" cy="23" r="1.4" fill="#00D9FF"/>
    <path opacity=".55" d="M330 36l3 2.5-3 2.5M337 41h12M330 49h20M330 56h14M364 35h26M368 41h20M368 47h16M364 61h30M364 68h22"/>
    <rect class="blink" x="330" y="63" width="6" height="8" rx="1" fill="#00D9FF" stroke="none"/>
  </g>

  <text class="name" x="24" y="42">amux</text>
  <text class="tag" x="24" y="64">python · gtk 3 · linux</text>
  <text class="desc" x="24" y="92">Terminal workspaces with split panes, a file</text>
  <text class="desc" x="24" y="111">explorer, 12 themes and Claude Code support.</text>

  <circle cx="29" cy="131.5" r="5" fill="#3572A5" stroke="#ffffff" stroke-opacity=".25"/>
  <text class="lang" x="39" y="135.5">Python</text>
  <circle cx="98" cy="131.5" r="5" fill="#89e051" stroke="#ffffff" stroke-opacity=".25"/>
  <text class="lang" x="108" y="135.5">Shell</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="420" height="150" viewBox="0 0 420 150" role="img" aria-labelledby="title desc">
  <title id="title">Cub3D</title>
  <desc id="desc">A Wolfenstein-style 3D engine written in pure C. No OpenGL, no game engine: just math and pixels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2027"/>
      <stop offset="1" stop-color="#1D3944"/>
    </linearGradient>
    <radialGradient id="glow" cx=".86" cy=".3" r=".5">
      <stop offset="0" stop-color="#00D9FF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .name { font: 700 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #E6EDF3 }
    .tag  { font: 500 11.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #00D9FF; letter-spacing: .3px }
    .desc { font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #A9BCC6 }
    .lang { font: 400 11.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #8FA6B2 }
    .art { stroke: #00D9FF; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round }
    .float { animation: float 4s ease-in-out infinite }
    .ping  { transform-origin: 362px 47px; animation: ping 2.4s ease-out infinite }
    .blink { animation: blink 1.1s step-end infinite }
    @keyframes float { 50% { transform: translateY(-3px) } }
    @keyframes ping  { from { transform: scale(1); opacity: .7 } to { transform: scale(2.6); opacity: 0 } }
    @keyframes blink { 50% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>

  <rect x=".5" y=".5" width="419" height="149" rx="12" fill="url(#bg)" stroke="#2C5364"/>
  <rect x=".5" y=".5" width="419" height="149" rx="12" fill="url(#glow)"/>

  <rect x="320" y="14" width="84" height="66" rx="6" fill="#00D9FF" fill-opacity=".07"/>
  <path d="M320 47h84v27a6 6 0 0 1-6 6h-72a6 6 0 0 1-6-6z" fill="#00D9FF" fill-opacity=".14"/>
  <g fill="#00D9FF">
    <rect x="323" y="17" width="6.6" height="60" opacity="0.92"/>
    <rect x="329.5" y="22" width="6.6" height="50" opacity="0.73"/>
    <rect x="336" y="26" width="6.6" height="42" opacity="0.57"/>
    <rect x="342.5" y="29.5" width="6.6" height="35" opacity="0.43"/>
    <rect x="349" y="32.5" width="6.6" height="29" opacity="0.32"/>
    <rect x="355.5" y="35" width="6.6" height="24" opacity="0.22"/>
    <rect x="362" y="35" width="6.6" height="24" opacity="0.22"/>
    <rect x="368.5" y="32.5" width="6.6" height="29" opacity="0.32"/>
    <rect x="375" y="29.5" width="6.6" height="35" opacity="0.43"/>
    <rect x="381.5" y="26" width="6.6" height="42" opacity="0.57"/>
    <rect x="388" y="22" width="6.6" height="50" opacity="0.73"/>
    <rect x="394.5" y="17" width="6.6" height="60" opacity="0.92"/>
  </g>

  <text class="name" x="24" y="42">Cub3D</text>
  <text class="tag" x="24" y="64">c · raycasting · 42 beirut</text>
  <text class="desc" x="24" y="92">A Wolfenstein-style 3D engine written in pure C.</text>
  <text class="desc" x="24" y="111">No OpenGL, no game engine: just math and pixels.</text>

  <circle cx="29" cy="131.5" r="5" fill="#555555" stroke="#ffffff" stroke-opacity=".25"/>
  <text class="lang" x="39" y="135.5">C</text>
</svg>
